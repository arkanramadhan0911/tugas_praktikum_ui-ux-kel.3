<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Praktikum Mandiri 6</title>
</head>
<body>
    <h2>Praktikum mandiri 6</h2>
    <p>Pengolah nilai Mahasiswa</p>
    <script>
        const nama = "Arkan Zahran Ramadhan";
        let nilai = 85;
        let aktif = true;

        console.log("Nama: ", nama);
        console.log("Nilai: ", nilai);
        console.log("Status Aktif: ", aktif);

        const tugas = 80;
        const uts = 70;
        const uas = 90;
        const akhir = tugas * 0.30 + uts * 0.30 + uas * 0.40;
        
        console.log("Nilai Akhir: ", akhir);
        console.log("Lulus: ", akhir >= 70);
    </script>
</body>
</html>
